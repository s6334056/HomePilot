<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomePilot QR Test Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 8px; }
    p { color: #888; margin-bottom: 24px; }
    #qr-container {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    canvas { display: block; }
    .text {
      margin-top: 16px;
      font-family: monospace;
      font-size: 14px;
      color: #4ade80;
      background: #0d1117;
      padding: 8px 16px;
      border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>HomePilot QR Test</h1>
  <p>このQRコードをiPhone Safariでスキャンしてください</p>
  <div id="qr-container">
    <canvas id="qr-canvas"></canvas>
  </div>
  <div class="text">HOME_PILOT_QR_TEST</div>
  <script>
    QRCode.toCanvas(document.getElementById('qr-canvas'), 'HOME_PILOT_QR_TEST', {
      width: 256,
      margin: 2,
      errorCorrectionLevel: 'Q'
    });
  </script>
</body>
</html>
