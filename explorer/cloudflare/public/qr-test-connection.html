<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomePilot QR Test - Connection JSON</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 8px; }
    p { color: #888; margin-bottom: 24px; }
    .qr-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    canvas { display: block; }
    .text {
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      background: #0d1117;
      padding: 12px 16px;
      border-radius: 6px;
      word-break: break-all;
      max-width: 400px;
      text-align: left;
    }
    .label {
      font-size: 12px;
      color: #888;
      margin-top: 16px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>HomePilot Connection QR</h1>
  <p>Launcherで表示される接続情報のQRコード（テスト用）</p>

  <div class="label">1. 簡易テスト文字列</div>
  <div class="qr-card">
    <canvas id="qr-simple"></canvas>
  </div>

  <div class="label">2. 接続情報JSON</div>
  <div class="qr-card">
    <canvas id="qr-json"></canvas>
  </div>

  <div class="label" style="margin-top: 24px">接続情報JSON:</div>
  <div class="text" id="json-display"></div>

  <script>
    const simpleText = 'HOME_PILOT_QR_TEST';
    const connectionJSON = JSON.stringify({
      type: 'homepilot-connection',
      version: 1,
      url: 'https://test-host.trycloudflare.com',
      token: 'test-token-1234567890'
    });

    document.getElementById('json-display').textContent = connectionJSON;

    QRCode.toCanvas(document.getElementById('qr-simple'), simpleText, {
      width: 200,
      margin: 2,
      errorCorrectionLevel: 'Q'
    });

    QRCode.toCanvas(document.getElementById('qr-json'), connectionJSON, {
      width: 300,
      margin: 2,
      errorCorrectionLevel: 'Q'
    });
  </script>
</body>
</html>
